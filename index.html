<script>
const SHEET_URL='https://docs.google.com/spreadsheets/d/1ieuovSRmRkGgOjjTDXpnXwwc-5612l0RkPLKkct0isQ/edit';
const names=['통합시트','수납샘플','개발샘플','공장샘플','구매샘플'];
let lastListSync=0,data=null,selected='통합시트',busy=false,timer=null,failures=0,detailId=null,shown=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validImage(u){return typeof u==='string'&&(/^(https:\/\/|data:image\/(png|jpeg|webp);base64,|blob:)/.test(u))}
function thumbnail(r){return validImage(r.image)?'<img loading="lazy" src="'+esc(r.image)+'" alt="'+esc(r.values[4])+' 사진">':'<span class="placeholder" aria-hidden="true">▱<small>'+ (photosBusy?'사진 불러오는 중':'사진 확인 필요')+'</small></span>'}
function fact(label,value){return '<div class="fact"><span class="fact-label">'+label+'</span><span class="fact-value">'+esc(value||'미등록')+'</span></div>'}
function sampleCard(r){return '<button class="card" data-id="'+esc(r.id)+'" aria-label="'+esc(r.values[4])+' 상세 보기"><div class="sample-top"><div class="thumb">'+thumbnail(r)+'</div><div class="info"><span class="badge">샘플타입 · '+esc(r.values[9]||selected)+'</span><div class="name">'+esc(r.values[4]||'이름 없는 샘플')+'</div><div class="meta">'+esc(r.values[5]||'스타일 번호 미등록')+'</div></div></div><div class="facts">'+fact('BOX No.',r.values[0])+fact('공장 / 국가',r.values[3])+fact('수량',r.values[7]?r.values[7]+'개':'')+fact('날짜',r.values[8])+'</div></button>'}
function active(){return data?.sheets.find(s=>s.name===selected)}
function schedule(){clearTimeout(timer);if(!document.hidden&&!window.SAMPLE_PREVIEW)timer=setTimeout(refresh,Math.max(1000,86400000-(Date.now()-lastListSync)))}

const configs=[{name:'통합시트',gid:292589099},{name:'수납샘플',gid:198237226},{name:'개발샘플',gid:1596067340},{name:'공장샘플',gid:1270164123},{name:'구매샘플',gid:2047566751}];
const headers=['Box No.','바코드번호','분류','공장/국가','제품명','스타일번호','이미지','수량','날짜','샘플타입','비고'];
let requestSerial=0;
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function makeSheet(config,values){const rows=[];for(let i=1;i<values.length;i++){const v=Array.from({length:11},(_,j)=>String(values[i][j]??''));if(!v.slice(0,6).some(x=>x.trim())&&!v[10].trim())continue;const label=x=>x.replace(/[\\s.\/]/g,'').toLowerCase();if(label(v[4])==='제품명'&&[label(v[0])==='boxno',label(v[5])==='스타일번호',label(v[9])==='샘플타입'].filter(Boolean).length>=2)continue;let image=validImage(v[6])?v[6]:'';if(!image&&v[6].includes('<img')){const doc=new DOMParser().parseFromString(v[6],'text/html');const src=doc.querySelector('img')?.getAttribute('src');if(validImage(src))image=src;v[6]=''}rows.push({id:config.gid+':'+(i+1),row:i+1,values:v,image})}return {...config,headers,rows}}
async function fetchSheet(config){
 try{const response=await fetch(SHEET_URL.replace('/edit','/export')+'?format=csv&gid='+config.gid+'&t='+Date.now(),{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('시트 접근 실패');const text=await response.text();if(/^\s*</.test(text)||!text.includes('Box No.'))throw new Error('CSV 응답 아님');return makeSheet(config,parseCSV(text))}
 catch(e){return await new Promise((resolve,reject)=>{const callback='sampleResponse'+(++requestSerial),script=document.createElement('script');const timeout=setTimeout(()=>finish(new Error(config.name+' 시트를 읽을 수 없습니다. 공유 권한을 확인해 주세요.')),12000);function finish(err,payload){clearTimeout(timeout);script.remove();delete window[callback];if(err)reject(err);else resolve(payload)}window[callback]=response=>{if(response.status!=='ok'||!response.table){finish(new Error(config.name+' 읽기 실패: '+(response.errors?.[0]?.detailed_message||'공유 권한을 확인해 주세요.')));return}const t=response.table;const values=[headers,...t.rows.map(r=>headers.map((_,i)=>{const c=r.c?.[i];return c?.f??c?.v??''}))];finish(null,makeSheet(config,values))};script.onerror=()=>finish(new Error(config.name+' 연결 실패'));const params=new URLSearchParams({gid:config.gid,headers:'1',range:'A:K',tqx:'out:json;responseHandler:'+callback,tq:'select *',t:String(Date.now())});script.src=SHEET_URL.replace('/edit','/gviz/tq')+'?'+params;document.head.append(script)})}
}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;const results=await Promise.allSettled(configs.map(fetchSheet));const failed=results.filter(r=>r.status==='rejected');const sheets=results.map((r,i)=>r.status==='fulfilled'?r.value:(data?.sheets.find(s=>s.name===configs[i].name)||null)).filter(Boolean);if(!sheets.length){error(failed[0]?.reason||new Error('시트 연결 실패'));return}receive({sheets,fetchedAt:new Date().toISOString()});if(failed.length){failures++;$('sync').textContent='일부 시트 갱신 실패';$('notice').textContent=failed.map(r=>r.reason.message).join(' · ')+' 마지막으로 받은 데이터는 유지합니다.';schedule()}}
function receive(payload){busy=false;$('refresh').disabled=false;data=payload;lastListSync=Date.now();applyPhotos();failures=0;$('notice').textContent=payload.preview?'화면 미리보기 · 실제 시트의 저장된 사본입니다. 자동 갱신은 배포 후 연결됩니다.':'';$('sync').textContent=payload.preview?'시트 사본 미리보기':'완료 · '+new Date(payload.fetchedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('footnote').textContent=payload.preview?'미리보기 · 자동 갱신 대기':'사진 자동 동기화 · 하루 1회';render();if($('detail').open)openDetail(detailId);schedule()}
function error(err){busy=false;$('refresh').disabled=false;failures++;$('sync').textContent='연결 확인 필요';$('notice').textContent=(data?'갱신에 실패했습니다. 마지막으로 받은 목록을 표시합니다. ':'목록을 불러오지 못했습니다. ')+(err?.message||'잠시 후 다시 시도해 주세요.');if(!data)$('list').innerHTML='<div class="empty">회사 구글 계정과 시트 접근 권한을<br>확인한 후 새로고침해 주세요.</div>';schedule()}
function dateSortKey(value) {
  const text=String(value??'').trim();
  const match=text.match(/^(\d{4})(?:\s*(?:[-./]|년)\s*(\d{1,2})(?:\s*(?:[-./]|월)\s*(\d{1,2}))?)?\s*(?:일|월|년|\.)?\s*$/);
  if(!match)return -1;
  const year=Number(match[1]),month=match[2]?Number(match[2]):0,day=match[3]?Number(match[3]):0;
  if(year<1900||year>9999||month>12||(match[2]&&month<1)||(match[3]&&(day<1||day>new Date(Date.UTC(year,month,0)).getUTCDate())))return -1;
  return year*10000+month*100+day;
}

function render(){
 $('tabs').innerHTML=names.map(n=>'<button type="button" role="tab" aria-selected="'+(selected===n)+'" data-sheet="'+n+'">'+n+'</button>').join('');
 const s=active();if(!s){$('list').innerHTML='<div class="empty">이 시트를 찾을 수 없습니다.</div>';return}
 const boxes=[...new Set(s.rows.map(r=>r.values[0]).filter(Boolean))];
 $('hero-label').textContent=selected+'의 샘플';$('total').innerHTML=s.rows.length+'<span>개 품목</span>';$('hero-meta').textContent=boxes.length+'개 박스 · '+s.rows.reduce((sum,r)=>sum+(Number(r.values[7])||0),0)+'개 수량';$('list-title').textContent=selected;
 const q=$('query').value.trim().toLocaleLowerCase();shown=s.rows.filter(r=>(!q||r.values.some(v=>String(v).toLocaleLowerCase().includes(q))));
 if($('sort').value==='name')shown.sort((a,b)=>a.values[4].localeCompare(b.values[4],'ko'));if($('sort').value==='date')shown.sort((a,b)=>dateSortKey(b.values[8])-dateSortKey(a.values[8]));
 $('result').textContent=shown.length+'개 품목';$('list').innerHTML=shown.length?shown.map(sampleCard).join(''):'<div class="empty">'+(s.rows.length?'검색 조건에 맞는 샘플이 없습니다.':'아직 등록된 샘플이 없습니다.<br>시트에 추가하면 이곳에 표시됩니다.')+'</div>';
 $('source').href=SHEET_URL+'#gid='+s.gid;
 $('list').querySelectorAll('img').forEach(img=>img.onerror=()=>{img.parentElement.innerHTML='<span class="placeholder">▱</span>'});
}
function openDetail(id){const s=active(),r=s?.rows.find(r=>r.id===id);if(!r){if($('detail').open)$('detail').close();return}if($('detail').open&&$('detail-name').textContent!==(r.values[4]||'이름 없는 샘플')){$('detail').close();return}detailId=id;$('detail-type').textContent=r.values[9]||selected;$('detail-name').textContent=r.values[4]||'이름 없는 샘플';$('detail-photo').innerHTML=validImage(r.image)?'<img class="photo" referrerpolicy="no-referrer" src="'+esc(r.image)+'" alt="'+esc(r.values[4])+'">':'';$('detail-fields').innerHTML=s.headers.map((h,i)=>i===6?'':'<div><dt>'+esc(h)+'</dt><dd>'+esc(r.values[i]||'—')+'</dd></div>').join('');$('detail-note').textContent=validImage(r.image)?'':'이미지 URL이 없는 샘플입니다. 원본 시트에서 사진을 확인할 수 있습니다.';$('detail-source').href=SHEET_URL+'#gid='+s.gid+'&range=A'+r.row+':K'+r.row;if(!$('detail').open)$('detail').showModal()}

let photosBusy=false,photoError='',photoIndex=new Map(),photoTimer=null,lastPhotoSync=0;
const photoKey=v=>[v[0],v[1],v[4],v[5],v[9]].map(x=>String(x??'').replace(/\s+/g,' ').trim()).join('|');
function applyPhotos(){if(!data)return;for(const sheet of data.sheets){const counts=new Map();for(const row of sheet.rows){const key=photoKey(row.values);const occurrence=(counts.get(key)||0)+1;counts.set(key,occurrence);const picture=photoIndex.get(sheet.name+'|'+key+'|occ:'+occurrence)||photoIndex.get('*|'+key+'|occ:'+occurrence);if(picture)row.image=picture;else if(row.image&&!validImage(row.values[6]))row.image=''}}}
async function loadPhotos(force=false){
 if(photosBusy||document.hidden)return;
 if(!force&&Date.now()-lastPhotoSync<86400000)return;
 photosBusy=true;$('image-status').textContent='최신 사진을 확인하고 있습니다…';
 try{
 const base=location.protocol==='file:'?'https://ohha-sample1.pages.dev/':location.href;
 const url=new URL('photos.json',base);url.searchParams.set('t',Date.now());
 const response=await fetch(url,{cache:'no-store',credentials:'omit'});
 if(!response.ok)throw new Error('사진 연결 실패');
 const payload=await response.json();
 if(!payload.photos||!Object.keys(payload.photos).length)throw new Error('사진 목록 없음');
 const next=new Map();for(const [key,path] of Object.entries(payload.photos)){
 if(/^photos\/[a-f0-9]{24}\.jpg$/.test(path))next.set(key,new URL(path,base).href);
 }
 if(!next.size)throw new Error('사진 목록 형식 오류');
 photoIndex=next;lastPhotoSync=Date.now();photoError='';applyPhotos();if(data)render();
 $('image-status').textContent='사진 업데이트 · '+new Date(payload.updatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
 if($('detail').open)openDetail(detailId);
 }catch(e){photoError=e.message;$('image-status').textContent='사진 연결을 확인해 주세요. 저장된 사진을 표시합니다.'}
 finally{photosBusy=false;clearTimeout(photoTimer);photoTimer=setTimeout(()=>loadPhotos(true),86400000)}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(photoTimer);else loadPhotos()});

$('sync-admin').onclick=()=>$('admin').showModal();$('admin').querySelector('.close').onclick=()=>$('admin').close();
$('tabs').onclick=e=>{const b=e.target.closest('[data-sheet]');if(b&&data){selected=b.dataset.sheet;render()}};
$('list').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openDetail(b.dataset.id)};
$('query').oninput=()=>{if(data)render()};$('sort').onchange=()=>{if(data)render()};$('refresh').onclick=()=>{refresh();loadPhotos(true)};$('detail').querySelector('.close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail')&&e.offsetX<0)$('detail').close()};document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else if(Date.now()-lastListSync>=86400000)refresh();else schedule()});refresh();loadPhotos();
</script></body></html>
